[package]
name = "powerplanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "powerplanner"
path = "src/main.rs"

[dependencies]
eframe = "0.28"
egui = "0.28"
tray-icon = "0.14"
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
log = "0.4"
fern = "0.6"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
egui_extras = "0.28"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# egui pixel math requires constant f32/f64/int conversions — suppress the cast family
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"

# internal application, not a published library — doc lints add no value here
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# intentional conventions
must_use_candidate = "allow"      # helpers/builders don't need #[must_use] annotations
module_name_repetitions = "allow" # render_foo() in ui::foo is standard egui convention
too_many_lines = "allow"          # render functions are long by nature; enforce manually

[profile.release]
opt-level = 3
lto = true
strip = true
